# Demo bootstrap: a fresh compose install is never empty.
# Registers the echo-mcp example and an OAuth-protected demo upstream, bundles
# them, and exposes endpoints; the identity demo has a bundle and endpoint of
# its own.
upstreams:
  - name: echo
    description: Demo echo MCP server
    url: http://echo-mcp:9000/mcp

  # An OAuth-protected upstream (examples/oauth-demo-mcp) reached on the
  # gateway's own loopback, where the compose stack runs it as a sidecar.
  # per_user: every caller connects their own account at the demo's login form
  # (demo_user / demo_password); discovery borrows the first connected account
  # to list its tools. The client is the public client the demo pre-registers
  - name: oauth-demo
    description: >
      OAuth-protected demo upstream (the MCP python-sdk simple-auth example).
      Until you connect your account, the bundle offers a tool that returns the
      connect link; sign in there with demo_user / demo_password.
    url: http://localhost:9000/mcp
    auth_mode: upstream_oauth
    identity_mode: per_user
    upstream_oauth:
      client_id: bundlemcp

  # An upstream that reports what it learns about its caller
  # (examples/identity-demo-mcp). The caller's authorization is forwarded and
  # introspected there; the static header is the demo's own discovery token,
  # which lets discovery list its tools and which the forwarded header replaces
  # at call time. Both maps use the lowercase name, so the forwarded value wins.
  - name: identity-demo
    description: >
      Reports the identity the gateway forwards: the introspected caller, the
      X-MCP-User header and a mapped tenant header.
    url: http://identity-demo:9000/mcp
    forward_headers:
      authorization: authorization
      x-tenant-id: x-tenant
    static_headers:
      authorization: Bearer identity-demo-discovery

bundles:
  - name: demo
    description: Demo bundle - the echo server plus an OAuth-protected upstream
    upstreams:
      - echo
      - oauth-demo

  - name: identity
    description: The identity demo, apart from the demo bundle
    upstreams:
      - identity-demo

endpoints:
  - name: demo
    bundle_name: demo
    profile: default
    auth_modes:
      - api_key

  # The URL to paste into claude.ai / Claude Desktop (<public url>/claude/mcp):
  # the oauth_only profile requires oauth alone, so every caller is a signed-in user
  # and can connect their own oauth-demo account.
  - name: claude
    bundle_name: demo
    profile: oauth_only
    auth_modes:
      - oauth

  # The same bundle for a ChatGPT connector (<public url>/chatgpt/mcp).
  - name: chatgpt
    bundle_name: demo
    profile: write_as_read
    auth_modes:
      - oauth

  # What an upstream learns about its caller, for OAuth users and API keys alike.
  - name: identity
    bundle_name: identity
    profile: default
    auth_modes:
      - oauth
      - api_key
