# Demo bootstrap: a fresh compose install is never empty.
# Registers the echo-mcp example, an OAuth-protected demo upstream and an
# upstream that introspects its callers, bundles them, and exposes endpoints.
upstreams:
  - name: echo
    description: Demo echo MCP server
    url: http://echo-mcp:9000/mcp

  # An OAuth-protected upstream (examples/oauth-demo-mcp) reached on the
  # gateway's own loopback, where the compose stack runs it as a sidecar.
  # per_user: every caller connects their own account at the demo's login form
  # (demo_user / demo_password); discovery borrows the first connected account
  # to list its tools. The client is the public client the demo pre-registers
  - name: oauth-demo
    description: >
      OAuth-protected demo upstream (the MCP python-sdk simple-auth example).
      Until you connect your account, the bundle offers a tool that returns the
      connect link; sign in there with demo_user / demo_password.
    url: http://localhost:9000/mcp
    auth_mode: upstream_oauth
    identity_mode: per_user
    upstream_oauth:
      client_id: bundlemcp

  # An upstream that verifies every caller itself (examples/introspect-demo-mcp):
  # it introspects the forwarded bearer against this gateway and reports what
  # reached it. Its own bundle and endpoint keep the demo bundle's tools as they are.
  - name: introspect-demo
    description: >
      Demo upstream that introspects the caller's forwarded bearer at this gateway
      and reports the identity and headers it received.
    url: http://introspect-demo:9000/mcp
    forward_headers:
      authorization: authorization
      x-tenant-id: x-tenant
    # Discovery has no caller bearer; this static header (replaced by the
    # forwarded one at call time) lets discovery pass the server's
    # introspection as an API-key caller. The dev service key: replace the
    # whole seed for a real deployment.
    static_headers:
      authorization: Bearer bmcp_sk_devservicekey000000000000000000000000

bundles:
  - name: demo
    description: Demo bundle - the echo server plus an OAuth-protected upstream
    upstreams:
      - echo
      - oauth-demo

  - name: passthrough
    description: The introspecting demo upstream, for header passthrough
    upstreams:
      - introspect-demo

endpoints:
  - name: demo
    bundle_name: demo
    profile: default
    auth_modes:
      - api_key

  # The URL to paste into claude.ai / Claude Desktop (<public url>/claude/mcp):
  # the oauth_only profile requires oauth alone, so every caller is a signed-in user
  # and can connect their own oauth-demo account.
  - name: claude
    bundle_name: demo
    profile: oauth_only
    auth_modes:
      - oauth

  # The same bundle for a ChatGPT connector (<public url>/chatgpt/mcp).
  - name: chatgpt
    bundle_name: demo
    profile: write_as_read
    auth_modes:
      - oauth

  # Signed-in users and API-key callers both reach the introspecting upstream.
  - name: passthrough
    bundle_name: passthrough
    profile: default
    auth_modes:
      - oauth
      - api_key
