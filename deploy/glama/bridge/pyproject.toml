# The stdio bridge of the Glama evaluation image (deploy/glama/). mcp-proxy needs
# the 1.x MCP SDK and the gateway the 2.x one, so the bridge is its own project
# with its own lock, outside the workspace. The image installs it with
# `uv sync --locked`, and tools/check_advisories.py audits this lock too.
[project]
name = "bundlemcp-glama-bridge"
version = "0"
requires-python = ">=3.14"
dependencies = ["mcp-proxy==0.15.0"]

[tool.uv]
package = false
constraint-dependencies = ["certifi>=2026.10.19"]
