[project]
name = "bundlemcp-workspace"
version = "0.1.0"
description = "bundlemcp workspace root (see packages/ and apps/)"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "fakeredis>=2.30",
    "aiosqlite>=0.21",
    "httpx>=0.28",
    "import-linter>=2.14",
]

[tool.uv.sources]
bundlemcp = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
# Skill scripts under .claude/ are tooling that ships with the skills, not project code.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "T20", # no print statements (OBS-1: structured logging only)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/bundlemcp/tests"]
markers = [
    "fleet: integration test requiring the private GHCR fleet images (skipped in CI)",
]

# Import-graph contracts. Run with `uv run lint-imports`.
[tool.importlinter]
root_package = "bundlemcp"
# Needed so the driver-free contracts below can name third-party modules.
include_external_packages = true
# `if TYPE_CHECKING:` imports carry no runtime coupling, so they do not count
# as layer violations — a use case may name a collaborator's type for annotation
# purposes without depending on it.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Clean architecture layers"
type = "layers"
# Highest first; a layer may import anything below it and nothing above it.
# `a | b` marks independent siblings: api and infrastructure never import each other.
layers = [
    "bundlemcp.main",
    "bundlemcp.api | bundlemcp.infrastructure",
    "bundlemcp.application",
    "bundlemcp.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application are driver-free"
type = "forbidden"
source_modules = ["bundlemcp.domain", "bundlemcp.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "redis",
    "httpx",
    "fastmcp",
    "mcp",
    "cryptography",
    "joserfc",
    "pydantic_settings",
    "alembic",
    "sqlalchemy",
    "sqlmodel",
]

[[tool.importlinter.contracts]]
# The delivery layer talks to adapters only through the contracts the composition
# root wired; naming an adapter in a controller would bypass that.
name = "Api never names an adapter"
type = "forbidden"
source_modules = ["bundlemcp.api"]
forbidden_modules = ["bundlemcp.infrastructure"]
