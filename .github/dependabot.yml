# Dependabot version updates. Security updates are configured in the repository settings.
# Version updates wait 7 days after a release (cooldown) so a compromised release can be
# caught before it lands here; security updates are never delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies"]
  - package-ecosystem: npm
    directories: ["/apps/web", "/docs"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
  - package-ecosystem: docker
    directories: ["/apps/gateway", "/apps/web", "/examples/echo-mcp"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: ["dependencies"]
