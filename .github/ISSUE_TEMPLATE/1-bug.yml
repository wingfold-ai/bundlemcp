name: Bug report
description: Report something that is broken or behaves differently from what the documentation says.
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search the existing issues first.
        **Security problems must not be reported here** — use the "Report a security vulnerability" link on the previous page.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version or commit you are using.
      placeholder: "1.2.3"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or code that shows the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages or logs. This is formatted as code automatically.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime version and anything else that might matter.
      placeholder: "Ubuntu 24.04, Node 22"
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find this bug.
          required: true
