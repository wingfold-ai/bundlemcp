# Publish the documentation site to Infomaniak web hosting by FTP.
# Pull requests build the site and check its size in ci.yml's docs job.
name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  SITE_DIR: docs/.vitepress/dist
  # Infomaniak's Starter hosting has a 10 MB quota; 9 MiB keeps headroom below it.
  MAX_SITE_BYTES: 9437184

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
        env:
          # page views go to Plausible only when the script URL variable is set
          DOCS_PLAUSIBLE_DOMAIN: bundlemcp.com
          DOCS_PLAUSIBLE_SCRIPT_URL: ${{ vars.DOCS_PLAUSIBLE_SCRIPT_URL }}
      - name: Require a password while the site is private
        env:
          DOCS_AUTH_USER: ${{ secrets.DOCS_AUTH_USER }}
          DOCS_AUTH_PASSWORD: ${{ secrets.DOCS_AUTH_PASSWORD }}
        run: |
          if [ -z "$DOCS_AUTH_USER" ] || [ -z "$DOCS_AUTH_PASSWORD" ]; then
            echo "No DOCS_AUTH_* secrets: the site is public."
            exit 0
          fi
          credentials=$(printf '%s:%s' "$DOCS_AUTH_USER" "$DOCS_AUTH_PASSWORD" | base64 -w0)
          echo "::add-mask::$credentials"
          { sed "s|@CREDENTIALS@|$credentials|g" docs/.vitepress/basic-auth.htaccess
            cat "$SITE_DIR/.htaccess"; } > "$RUNNER_TEMP/htaccess"
          mv "$RUNNER_TEMP/htaccess" "$SITE_DIR/.htaccess"
          echo "The site requires a password."
      - name: Stays within the hosting quota
        run: |
          size=$(du -sb "$SITE_DIR" | cut -f1)
          echo "Site size: $size bytes (limit $MAX_SITE_BYTES)"
          test "$size" -le "$MAX_SITE_BYTES"
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.INFOMANIAK_FTP_SERVER }}
          username: ${{ secrets.INFOMANIAK_FTP_USERNAME }}
          password: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
          protocol: ${{ vars.INFOMANIAK_FTP_PROTOCOL || 'ftps' }}
          local-dir: ./${{ env.SITE_DIR }}/
          server-dir: ${{ vars.INFOMANIAK_FTP_SERVER_DIR || './' }}
          # Only files this workflow uploaded are tracked; anything else on the
          # server (e.g. Infomaniak's own files) is left alone.
          dangerous-clean-slate: false
