# Cut a release from a v<major>.<minor>.<patch> tag: check the
# changelog has an entry for it, rehearse the restore, publish both images as
# :<version>, then create the GitHub release from the changelog entry, framed
# with what bundlemcp is, the images, where to start and a comparison with the
# previous release. It is marked latest only when it is the highest version, so
# a patch for an older line never takes over releases/latest. Each
# step needs the one before, so a missing entry or a failed rehearsal publishes
# nothing. A tag pushed by hand starts it; a merge that raises the version calls
# it, because a tag pushed with the workflow token starts no workflow.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      version:
        description: The version to release, e.g. 1.2.0; its tag must exist
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the previous release tag decides "changed since"
      - name: The changelog has an entry for this tag
        run: python3 tools/release_notes.py "$TAG"
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  rehearse:
    needs: notes
    uses: ./.github/workflows/restore-rehearsal.yml

  images:
    needs: [notes, rehearse]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.notes.outputs.version }}

  release:
    needs: [notes, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Create the GitHub release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 tools/release_notes.py --repo "$GH_REPO" "$TAG" > "$RUNNER_TEMP/notes.md"
          latest=$(python3 tools/release_notes.py --latest "$TAG")
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest="$latest"
