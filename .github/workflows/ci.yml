# CI: lint + hermetic tests + frontend contract + diagram validation + image builds.
name: CI

on:
  # A pull request runs CI once through pull_request; push covers main only, so
  # a branch with an open pull request is not built twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-packages
      - name: Ruff
        run: uv run ruff check .
      - name: Markdown line length
        run: uv run rumdl check .
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Generated API contract is current (UI-3)
        # The OpenAPI document and the TypeScript types are generated, never
        # hand-written; a change to a DTO that was not regenerated fails here.
        run: |
          npm run openapi
          git diff --exit-code -- apps/web/openapi.json apps/web/types/api.d.ts
        working-directory: apps/web
      - name: Typecheck (DEP-10)
        # nuxt build bundles code that does not typecheck; only vue-tsc catches it
        run: npm run typecheck
        working-directory: apps/web
      - name: Build
        run: npm run build
        working-directory: apps/web
      - name: UI unit tests (UI-13)
        # the UI's pure logic and the query cache, in Vitest; the pages
        # themselves are covered by the browser suite in the integration job
        run: npm test
        working-directory: apps/web

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - name: Build the documentation site (DOC-2, dead links fail the build)
        run: npm run build
        working-directory: docs
      # The VitePress build only checks the pages it builds: config.ts excludes
      # arc42/**, adr/**, likec4/** and every README. These four checks cover
      # exactly the documentation nothing else verifies, which is where #44 and
      # #47 left stale symbols behind.
      - name: Links and anchors outside the VitePress build
        run: python3 tools/check_docs_links.py
      - name: Living docs name no dead symbols
        run: python3 tools/check_docs_symbols.py
      - name: Settings and requirement IDs are documented and real
        run: python3 tools/check_docs_settings.py
      - name: ADR statuses and indexes agree (DOC-8)
        run: python3 tools/check_adr_graph.py
      - name: Requirement codes are well-formed, unique, cited correctly and dated
        run: python3 tools/check_spec_ids.py
      - name: The development stack publishes host ports on loopback only (DEP-13)
        run: python3 tools/check_compose_ports.py
      - name: deploy/stack.sh generates the development secrets (DEP-13)
        run: bash tests/deploy/test_stack_secrets.sh
      - name: The changelog's entries are well-formed (DEP-11)
        run: python3 tools/release_notes.py --check
      - name: The sitemap lists every built page and robots.txt names it (DOC-13)
        run: python3 tools/check_docs_sitemap.py
      - name: Site stays within the hosting quota (DOC-6, 9 MiB of a 10 MB plan)
        run: |
          size=$(du -sb docs/.vitepress/dist | cut -f1)
          echo "Site size: $size bytes (limit 9437184)"
          test "$size" -le 9437184

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate LikeC4 model (DOC-10)
        run: npx --yes likec4 validate docs/likec4
      - name: Validate OpenSpec specs and changes (DOC-7)
        run: npx --yes @fission-ai/openspec@1.14.0 validate --all --strict --no-interactive
        env:
          OPENSPEC_TELEMETRY: "0"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build gateway image
        run: docker build -f apps/gateway/Dockerfile -t bundlemcp-gateway:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t bundlemcp-web:ci .

  security:
    # Known advisories in the locked dependencies, secrets in the commits this run adds, and
    # Dockerfile lint. Ruff's security rules run in the backend job's Ruff step.
    runs-on: ubuntu-latest
    env:
      # the release binary, verified against the checksum the release publishes
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the secret scan reads the commits between the base and the head
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Dependency advisories in uv.lock and the npm lockfiles (DEP-14)
        # npm audit --package-lock-only reads the lockfiles, so nothing is installed
        run: uv run python tools/check_advisories.py
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: No secrets in the commits this run adds (DEP-14)
        # A pull request's own commits; a push's new commits; on a manual run, the history of
        # the checked-out branch. Known examples are listed in .gitleaksignore.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$GITHUB_SHA" ;;
            *) range="$GITHUB_SHA" ;;
          esac
          # a push that creates the branch has no commit before it
          case "$PUSH_BEFORE" in *[!0]*) ;; *) [ "$EVENT" = push ] && range="$GITHUB_SHA" ;; esac
          echo "Scanning $range"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$range" .
      - name: Dockerfile lint (DEP-14)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: >-
            apps/gateway/Dockerfile apps/web/Dockerfile examples/conformance-mcp/Dockerfile
            examples/echo-mcp/Dockerfile examples/identity-demo-mcp/Dockerfile
            examples/oauth-demo-mcp/Dockerfile
          config: .hadolint.yaml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-packages
      - name: Bring up the core stack
        # Every image of the stack is built here or pulled from a public
        # registry, so CI runs the same stack a contributor does. No deploy/.env in CI, so BUNDLEMCP_PUBLIC_URL falls back to
        # http://localhost:8000. --wait blocks on the health checks. The replica
        # overlay adds a second gateway and a round-robin proxy for the restart,
        # rolling-update and propagation tests.
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.replicas.yml up -d --build --wait --wait-timeout 300
      - name: Discover the seeded demo upstreams
        # Bootstrap schedules tool discovery best-effort (async), so a fresh boot
        # can race the example servers' startup. Force + confirm discovery so
        # their tools are present before the suite asserts on them.
        run: |
          SK=bmcp_sk_devservicekey000000000000000000000000
          for server in echo identity-demo; do
            for i in $(seq 1 30); do
              n=$(curl -s -X POST -H "Authorization: Bearer $SK" \
                "http://localhost:8000/api/v1/upstreams/$server:refresh-tools" \
                | python3 -c "import sys,json;print(json.load(sys.stdin).get('discovered',0))" 2>/dev/null || echo 0)
              [ "$n" -gt 0 ] && { echo "$server discovered $n tools"; break; }
              sleep 3
            done
          done
      - name: Run integration suite
        env:
          BUNDLEMCP_INTEGRATION: "1"
        run: uv run pytest tests/integration -q
      - name: Gateway overhead report (OPS-13, a report and not a gate)
        if: always()
        run: |
          if [ -f overhead-report.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("overhead-report.json"))
          verdict = "within" if r["within_budget"] else "**exceeded**"
          print("### Gateway overhead on tools/call\n")
          print("| path | p50 ms | p95 ms |\n|---|---|---|")
          for path in ("direct", "gateway"):
              ms = r[f"{path}_ms"]
              print(f"| {path} | {ms['p50']:.1f} | {ms['p95']:.1f} |")
          print(f"\np95 overhead {r['overhead_p95_ms']:.1f} ms, budget {r['budget_ms']:.0f} ms: {verdict}")
          PY
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: overhead-report
          path: overhead-report.json
          if-no-files-found: ignore
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Admin UI browser suite (UI-13)
        # Every Playwright scenario, against the stack started above; a
        # scenario a contributor adds runs without a change to this step. The OAuth consent scenarios are among
        # them: HTTP clients ignore CSP, so only a browser proves that Approve
        # and Deny reach a client redirect URI on another origin.
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.replicas.yml logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.replicas.yml down -v

  conformance-revisions:
    # The served revisions the MCP conformance suite has scenarios for, read
    # from the gateway's own registry, so a new revision joins the matrix.
    runs-on: ubuntu-latest
    outputs:
      revisions: ${{ steps.list.outputs.revisions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - id: list
        run: echo "revisions=$(uv run python tests/conformance/run_conformance.py --list-revisions)" >> "$GITHUB_OUTPUT"

  conformance:
    needs: conformance-revisions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(needs.conformance-revisions.outputs.revisions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Bring up the gateway and the conformance fixture server
        run: |
          docker compose -f deploy/docker-compose.yml --profile conformance \
            up -d --build --wait --wait-timeout 300 gateway conformance-mcp
      - name: MCP conformance suite (PROT-22)
        run: uv run python tests/conformance/run_conformance.py --revision "${{ matrix.revision }}"
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile conformance logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml --profile conformance down -v

  ci-passed:
    # The one check the branch ruleset requires; renaming a job above does not
    # silently drop it from the requirement. CI's own commits on a branch say
    # [skip ci] and run nothing, so this job also sets its result on them when
    # one is the branch head.
    name: ci-passed
    if: always()
    needs: [backend, frontend, docs, diagrams, image, security, integration, conformance-revisions, conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: write
    env:
      SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Collect the jobs' results
        id: result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          result=success
          for each in $RESULTS; do
            if [ "$each" != "success" ]; then echo "A required job ended with: $each"; result=failure; fi
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SAME_REPO == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: env.SAME_REPO == 'true'
      - name: Set the result on CI's own commits at the branch head
        if: env.SAME_REPO == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.result.outputs.result }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          head=$(gh api "repos/$GH_REPO/branches/$BRANCH" --jq .commit.sha)
          uv run --no-project --with pydantic==2.13.5 python tools/ci_result_relay.py "$head" \
            --source "$SOURCE" --result "$RESULT" --url "$URL"
      - name: Fail unless every required job succeeded
        env:
          RESULT: ${{ steps.result.outputs.result }}
        run: test "$RESULT" = success
