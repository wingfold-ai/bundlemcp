# Publish the gateway and web images to GHCR. Deployed by the
# vm-stack repo's `bundlemcp` stack, which pulls :latest on every converge.
# release.yml calls it with a version for a release tag.
name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version the images are tagged with, e.g. 1.2.0"
        type: string
        required: true

permissions:
  contents: read
  packages: write
  # signed build provenance for each pushed image (artifact attestations)
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        image: [gateway, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose the tags
        # main: :latest, what vm-stack deploys, and :<sha>, the commit. A release:
        # :<version> and :<sha>, leaving :latest to main, so tagging an older commit
        # never moves what a continuously deployed stack runs.
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/bundlemcp-${{ matrix.image }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "list<<EOF"
            if [ -n "$VERSION" ]; then echo "$IMAGE:$VERSION"; else echo "$IMAGE:latest"; fi
            echo "$IMAGE:$GITHUB_SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # an SBOM and a full SLSA provenance record, attached to the image in the registry
          sbom: true
          provenance: mode=max
      - name: Attest the build provenance
        # GitHub signs the provenance for public repositories on every plan; `gh attestation
        # verify oci://<image>:<tag> --owner <owner>` checks it.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/bundlemcp-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
