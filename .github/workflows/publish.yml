# Publish the gateway and web images to GHCR (spec 71 DEP-11). Deployed by the
# vm-stack repo's `bundlemcp` stack, which pulls :latest on every converge.
name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [gateway, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          # :latest is what vm-stack deploys; :<sha> records the commit (DEP-11).
          tags: |
            ghcr.io/${{ github.repository_owner }}/bundlemcp-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/bundlemcp-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
