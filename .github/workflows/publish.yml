# Publish the gateway and web images to GHCR (spec 71 DEP-11). Deployed by the
# vm-stack repo's `bundlemcp` stack, which pulls :latest on every converge.
name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [gateway, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          # :latest is what vm-stack deploys; :<sha> records the commit (DEP-11).
          tags: |
            ghcr.io/${{ github.repository_owner }}/bundlemcp-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/bundlemcp-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
