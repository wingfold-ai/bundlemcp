[project]
name = "bundlemcp"
version = "0.1.0"
description = "Self-hostable MCP bundling gateway"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116",
    "fastmcp>=3.4",
    "sqlmodel>=0.0.39",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.13",
    "pydantic-settings>=2.10",
    "redis>=6.2",
    "uvicorn>=0.35",
    "httpx>=0.28",
    "structlog>=25.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bundlemcp"]
