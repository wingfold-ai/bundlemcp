[project]
name = "bundlemcp"
version = "0.4.0"
description = "Self-hostable MCP bundling gateway"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.116",
    "fastmcp>=4.1.2",
    "mcp-types>=2.1",
    "sqlmodel>=0.0.39",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.13",
    "pydantic-settings>=2.10",
    "redis>=6.2",
    "uvicorn>=0.35",
    "httpx>=0.28",
    "structlog>=25.4",
    "joserfc>=1.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "cryptography>=44",
    "pyyaml>=6.0",
    "prometheus-client>=0.23",
]

[project.optional-dependencies]
# OpenTelemetry tracing, loaded only when an exporter endpoint is configured
otel = [
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-instrumentation-redis>=0.66b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bundlemcp"]
