[project]
name = "bundlemcp"
version = "0.1.1"
description = "Self-hostable MCP bundling gateway"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.116",
    "fastmcp>=4.0.3",
    "mcp-types>=2.1",
    "sqlmodel>=0.0.39",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.13",
    "pydantic-settings>=2.10",
    "redis>=6.2",
    "uvicorn>=0.35",
    "httpx>=0.28",
    "structlog>=25.4",
    "joserfc>=1.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "cryptography>=44",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bundlemcp"]
