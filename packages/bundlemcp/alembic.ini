[alembic]
# Package-relative, so the same file works from a checkout and from an
# installed wheel (the gateway image runs it from /app).
script_location = bundlemcp:migrations
# URL is taken from BUNDLEMCP_DATABASE_URL (env.py); this is a fallback for local dev.
sqlalchemy.url = postgresql+asyncpg://bundlemcp:bundlemcp@localhost:5432/bundlemcp

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
