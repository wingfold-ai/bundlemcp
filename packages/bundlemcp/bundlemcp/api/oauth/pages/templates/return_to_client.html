<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Return to {{ client_name }} — bundlemcp</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6f7f9; color: #1a1d21;
           display: flex; justify-content: center; padding-top: 8vh; }
    .card { background: #fff; border: 1px solid #e2e5e9; border-radius: 12px;
            padding: 2rem; max-width: 26rem; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    h1 { font-size: 1.15rem; margin: 0 0 1rem; }
    a.continue { display: inline-block; margin-top: 1rem; padding: .6rem 1rem; border-radius: 8px;
                 background: #1a7f37; color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ heading }}</h1>
    <p>Continue to <b>{{ client_name }}</b> to finish.</p>
    <a class="continue" href="{{ location }}">Continue</a>
  </div>
</body>
</html>
